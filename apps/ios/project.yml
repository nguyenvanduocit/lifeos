# XcodeGen spec: `make ios` (or `xcodegen generate` here) writes LifeOS.xcodeproj, which is not checked in.
name: LifeOS
options:
  bundleIdPrefix: dev.aiocean
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your team: set it here or pass DEVELOPMENT_TEAM=... to xcodebuild. A free Apple ID works for your own phone.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LifeOS:
    type: application
    platform: iOS
    sources: [LifeOS]
    entitlements:
      path: LifeOS/LifeOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: LifeOS/Info.plist
      properties:
        CFBundleDisplayName: LifeOS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSHealthShareUsageDescription: LifeOS đọc bước chân, quãng đường, giấc ngủ, cân nặng, nhịp tim nghỉ, HRV, năng lượng hoạt động và phút tập để gửi về LifeOS trên máy của bạn.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [dev.aiocean.lifeos.health-refresh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.aiocean.lifeos
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
