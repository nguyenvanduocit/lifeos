[package]
name = "lifeos-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["serde"] }
croner = "4.0.3"
getrandom = "0.4.3"
sha2 = "0.11.1"
subtle = "2.6.1"
url = "2.5.9"
deunicode = "1.6.2"
dirs = "7.0.0"
lifeos-wire = { version = "0.1.0", path = "../lifeos-wire" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["chrono-impl"], optional = true }
walkdir = "2.5.1"
tempfile = "3.27.0"


[features]
# `make gen`: TypeScript of the tool inputs and the read tools' map.
ts = ["dep:ts-rs", "lifeos-wire/ts"]
