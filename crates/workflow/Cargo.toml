[package]
name = "workflow"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# remit's lints, kept with the code taken from it.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "deny"

[dependencies]
hex = "0.4"
model = { path = "../model" }
oxc_allocator = "0.158"
oxc_ast = "0.158"
oxc_parser = "0.158"
oxc_span = "0.158"
# Default features only (`std`): no async runtime, module loader or threads in the VM (ADR-0075, decision 2).
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
