[package]
name = "claudecode"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# remit's lints, kept with the code taken from it.
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
redundant_clone = "deny"

[dependencies]
childenv = { path = "../childenv" }
claudehooks = { path = "../claudehooks" }
jail = { path = "../jail" }
procgroup = { path = "../procgroup" }
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["raw_value"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "time", "macros", "fs"] }
