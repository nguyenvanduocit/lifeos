[package]
name = "lifeos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive", "env"] }
lifeos-agent = { version = "0.1.0", path = "../lifeos-agent" }
lifeos-core = { version = "0.1.0", path = "../lifeos-core" }
lifeos-mcp = { version = "0.1.0", path = "../lifeos-mcp" }
lifeos-telegram = { version = "0.1.0", path = "../lifeos-telegram" }
lifeos-web = { version = "0.1.0", path = "../lifeos-web" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
