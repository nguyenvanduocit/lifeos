[package]
name = "lifeos-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = "0.4.45"
serde_json = "1.0.154"
anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
lifeos-agent = { version = "0.1.0", path = "../lifeos-agent" }
lifeos-core = { version = "0.1.0", path = "../lifeos-core" }
lifeos-wire = { version = "0.1.0", path = "../lifeos-wire" }
mime_guess = "2.0.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rust-embed = "8.14.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
web-transport-quinn = { version = "0.13.6", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.9"
