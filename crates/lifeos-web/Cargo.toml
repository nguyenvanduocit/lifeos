[package]
name = "lifeos-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lifeos-mcp = { path = "../lifeos-mcp" }
lifeos-telegram = { path = "../lifeos-telegram" }
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.105"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
lifeos-agent = { version = "0.1.0", path = "../lifeos-agent" }
lifeos-core = { version = "0.1.0", path = "../lifeos-core" }
lifeos-google = { version = "0.1.0", path = "../lifeos-google" }
lifeos-wire = { version = "0.1.0", path = "../lifeos-wire" }
mime_guess = "2.0.5"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
ring = "0.17.14"
rust-embed = "8.14.0"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.54.1", features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
url = "2.5.9"
web-transport-quinn = { version = "0.13.6", default-features = false, features = ["ring"] }

link = { path = "../link" }
plugin = { path = "../plugin" }
plugin-wire = { package = "lifeos-plugin-wire", path = "../lifeos-plugin-wire" }
plugin-sdk = { path = "../plugin-sdk" }
uuid = { version = "1", features = ["v4"] }

tempfile = "3.27.0"
hex = "0.4.3"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
url = "2.5.9"
