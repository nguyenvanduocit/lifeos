[package]
name = "lifeos-telegram"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.105"
lifeos-agent = { version = "0.1.0", path = "../lifeos-agent" }
lifeos-wire = { version = "0.1.0", path = "../lifeos-wire" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "time"] }
tracing = "0.1.44"
